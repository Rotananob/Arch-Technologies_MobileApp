name: college_alert
description: "College Alert - Android Application for Campus Notifications & Events"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.2.0
  
  # Network & API
  dio: ^5.4.3+1
  
  # Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # Typography & Localization
  google_fonts: ^6.2.1
  intl: ^0.20.3
  
  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
